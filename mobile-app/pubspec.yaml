name: ar_furniture_studio
description: "AR Furniture Studio — virtually place furniture in your room using Augmented Reality."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3

  # Networking
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # AR
  ar_flutter_plugin_flutterflow: ^0.7.3
  vector_math: ^2.1.4
  uuid: ^4.5.1

  # 360-degree product turntable preview (separate from full-room AR placement)
  model_viewer_plus: ^1.9.3

  # Camera / measuring / QR
  camera: ^0.11.0+2
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  # Firebase (push notifications)
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.0

  # Env
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  # Generates Android/iOS launcher icons from assets/icon/app_icon.png —
  # run `dart run flutter_launcher_icons` after `flutter pub get` (and
  # after `flutter create .` if the android/ios platform folders don't
  # exist yet in this checkout).
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2E5945"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/lottie/
    - assets/models/
    - .env
